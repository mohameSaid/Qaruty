<h2 mat-dialog-title>{{ data.title }}</h2>
<form [formGroup]="form" (ngSubmit)="onSave()">
  <mat-dialog-content class="form-content">
    <mat-form-field appearance="outline">
      <mat-label>الاسم بالعربية</mat-label>
      <input matInput formControlName="arabicName" dir="rtl" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>الاسم بالإنجليزية</mat-label>
      <input matInput formControlName="englishName" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialogRef.close()">إلغاء</button>
    <button mat-flat-button color="primary" type="submit">حفظ</button>
  </mat-dialog-actions>
</form>
