<div class="app-shell">
  <mat-toolbar color="primary" class="app-toolbar">
    <button
      mat-icon-button
      [matTooltip]="sidebarOpen() ? 'إخفاء القائمة' : 'إظهار القائمة'"
      (click)="toggleSidebar()"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <mat-icon class="brand-icon">groups</mat-icon>
    <span class="brand-title">قريتي - كفر أبو الحسن</span>
    <span class="spacer"></span>
    <button
      mat-icon-button
      [matTooltip]="theme.mode() === 'dark' ? 'التبديل إلى الوضع الفاتح' : 'التبديل إلى الوضع الداكن'"
      (click)="theme.toggle()"
    >
      <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <button mat-icon-button matTooltip="الملف الشخصي" routerLink="/profile" routerLinkActive="active">
      <mat-icon>account_circle</mat-icon>
    </button>
    <button mat-icon-button matTooltip="تغيير كلمة المرور" (click)="openChangePassword()">
      <mat-icon>lock_reset</mat-icon>
    </button>
    <button mat-icon-button matTooltip="تسجيل الخروج ({{ auth.nationalId() }})" (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <div class="app-body">
    @if (sidebarOpen()) {
      <div class="nav-backdrop" (click)="closeSidebarOnMobile()"></div>
    }

    <nav class="nav-rail" [class.collapsed]="!sidebarOpen()">
      <a
        *appHasPermission="Permission.dashboard"
        class="rail-item"
        routerLink="/dashboard"
        routerLinkActive="active"
        (click)="closeSidebarOnMobile()"
      >
        <mat-icon>space_dashboard</mat-icon>
        <span>الرئيسية</span>
      </a>
      <a class="rail-item" routerLink="/memorization-platform" routerLinkActive="active" (click)="closeSidebarOnMobile()">
        <mat-icon>auto_stories</mat-icon>
        <span>منصة التحفيظ</span>
      </a>
      <a
        *appHasPermission="Permission.UsersRead"
        class="rail-item"
        routerLink="/users"
        routerLinkActive="active"
        (click)="closeSidebarOnMobile()"
      >
        <mat-icon>groups</mat-icon>
        <span>المستخدمون</span>
      </a>
      <a
        *appHasPermission="Permission.CompetitionsRead"
        class="rail-item"
        routerLink="/competitions"
        routerLinkActive="active"
        (click)="closeSidebarOnMobile()"
      >
        <mat-icon>emoji_events</mat-icon>
        <span>المسابقات</span>
      </a>
      <a
        *appHasPermission="Permission.UserCreate"
        class="rail-item"
        routerLink="/system-management/requests"
        routerLinkActive="active"
        (click)="closeSidebarOnMobile()"
      >
        <mat-icon>assignment_turned_in</mat-icon>
        <span>الطلبات</span>
      </a>
      <a
        *appHasPermission="Permission.systemCodesRead"
        class="rail-item"
        routerLink="/system-management/lookups"
        routerLinkActive="active"
        (click)="closeSidebarOnMobile()"
      >
        <mat-icon>tune</mat-icon>
        <span>إدارة القوائم</span>
      </a>
    </nav>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
